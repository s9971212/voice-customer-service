[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-customer-service"
version = "0.1.0"
description = "A tool for Voice Customer Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.53",
    "PyMySQL>=1.2.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.53.0",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "openai>=3.19.0",
]

[tool.setuptools.packages.find]
where = ["src"]
